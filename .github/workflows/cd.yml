name: cd
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "terraform/**"
  release:
    types: ["published"]

concurrency:
  # Only allow for one action to run at once, queue any others
  group: cd
  # Don't cancel existing
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.clean_version.outputs.version }}
    steps:
      - id: get
        uses: actions/github-script@v6
        env:
          LATEST_TAG: ${{ steps.latest_release.outputs.release }}
        with:
          result-encoding: string
          script: |
            if (context.eventName == "release") {
              return context.payload.release.tag_name
            } else {
              return ""
            }

      - id: clean_version
        run: |
          version=$(echo "${{ steps.get.outputs.result }}" | sed 's/v//g')
          echo "version=$version" >> $GITHUB_OUTPUT

  deploy-infra-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.cloud-auth-api.reown.com/health
    needs:
      - get-version
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # - id: deploy-staging
      #   uses: WalletConnect/actions/actions/deploy-terraform/@2.5.4
      #   env:
      #     TF_LOG: DEBUG
      #     TF_VAR_node_env: staging
      #     TF_VAR_supabase_jwt_secret: ${{ secrets.SUPABASE_JWT_SECRET }}
      #     TF_VAR_cookie_name: ${{ secrets.COOKIE_NAME }}
      #     TF_VAR_cookie_secret: ${{ secrets.COOKIE_SECRET }}
      #     TF_VAR_hcaptcha_secret: ${{ secrets.HCAPTCHA_SECRET }}
      #     TF_VAR_direct_url: ${{ secrets.DIRECT_URL }}
      #     TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      #     TF_VAR_redis_host: ${{ secrets.REDIS_HOST }}
      #     TF_VAR_redis_port: ${{ secrets.REDIS_PORT }}
      #     TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}
      #     TF_VAR_walletconnect_project_id: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: eu-central-1
      #     environment: staging
      #     app-name: ${{ github.event.repository.name }}

      ##############################################
      #
      # 1) Grafana Central setup
      #
      ##############################################

      - name: Configure AWS Credentials for Monitoring account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_MONITORING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create Grafana Central key
        id: grafana-get-key
        uses: WalletConnect/ci_workflows/.github/actions/grafana-key@main
        with:
          workspace-name: ${{ vars.GRAFANA_WORKSPACE_NAME }}
          key-prefix: ${{ github.event.repository.name }}

      ##############################################
      #
      # 2) Staging account setup
      #
      ##############################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Cache Terraform data
        uses: actions/cache@v3
        with:
          path: ${{ vars.TF_DIRECTORY }}/.terraform
          key: terraform-${{ hashFiles('${{ vars.TF_DIRECTORY }}/.terraform.lock.hcl') }}

      - name: Init Terraform
        working-directory: ${{ vars.TF_DIRECTORY }}
        run: terraform init -no-color

      - name: Configure Terraform Variables
        uses: WalletConnect/ci_workflows/.github/actions/tf-vars@main
        with:
          infra-directory: ${{ vars.TF_DIRECTORY }}
          variables: |
            grafana_auth:${{ steps.grafana-get-key.outputs.key }}
            ${{ inputs.tf-variables }}

      - name: Apply staging
        working-directory: ${{ vars.TF_DIRECTORY }}
        env:
          TF_WORKSPACE: staging
          TF_LOG: DEBUG
          TF_VAR_node_env: staging
          TF_VAR_supabase_jwt_secret: ${{ secrets.SUPABASE_JWT_SECRET }}
          TF_VAR_cookie_name: ${{ secrets.COOKIE_NAME }}
          TF_VAR_cookie_secret: ${{ secrets.COOKIE_SECRET }}
          TF_VAR_hcaptcha_secret: ${{ secrets.HCAPTCHA_SECRET }}
          TF_VAR_direct_url: ${{ secrets.DIRECT_URL }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_redis_host: ${{ secrets.REDIS_HOST }}
          TF_VAR_redis_port: ${{ secrets.REDIS_PORT }}
          TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}
          TF_VAR_walletconnect_project_id: ${{ secrets.WALLETCONNECT_PROJECT_ID }}

        run: terraform apply -auto-approve -no-color


      ##############################################
      #
      # 3) Grafana Central cleanup
      #
      ##############################################

      - name: Configure AWS Credentials for Monitoring account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_MONITORING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete Grafana key
        if: ${{ always() }}
        uses: WalletConnect/actions/aws/grafana/delete-key/@2.5.4
        with:
          workspace-id: ${{ steps.grafana-get-key.outputs.workspace-id }}
          key-name: ${{ steps.grafana-get-key.outputs.key-name }}



